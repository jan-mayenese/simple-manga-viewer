[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-manga-viewer"
version = "0.1.0"
description = "A desktop manga reader for Linux and Windows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND LicenseRef-UnRAR"
license-files = ["LICENSE", "manga_viewer/vendor/unrar/*/LICENSE.txt"]
dependencies = [
    # PySide6 6.12.0 can abort on Python 3.10 and 3.11 (PYSIDE-3474).
    "PySide6>=6.8,!=6.12.0,<7",
    "Pillow>=12.1,<13",
    "pillow-jxl-plugin>=1.3.8,<2",
    "py7zr>=1.1.4,<2",
    "rarfile>=4.5,<5",
]

[project.gui-scripts]
manga-viewer = "manga_viewer.__main__:main"

[tool.setuptools.packages.find]
include = ["manga_viewer*"]

[tool.setuptools.package-data]
manga_viewer = [
    "assets/unripe-mango.png",
    "vendor/unrar/linux-x86_64/*",
    "vendor/unrar/windows-x86_64/*",
]
